<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tacliimi - Verify Certificate</title>
    <link href="/src/index.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Background Decor -->
    <div class="fixed top-[-20%] left-[-10%] w-[60%] h-[60%] bg-primary/5 rounded-full blur-[100px] -z-10 mix-blend-multiply dark:mix-blend-lighten pointer-events-none"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-accent-gold/5 rounded-full blur-[80px] -z-10 mix-blend-multiply dark:mix-blend-lighten pointer-events-none"></div>

    <div class="w-full max-w-lg mb-8 text-center">
        <a href="/" class="inline-block mb-6 hover:scale-105 transition-transform"><h1 class="text-3xl font-black text-primary font-serif">Tacliimi.</h1></a>
        <h2 class="text-4xl font-bold text-slate-900 dark:text-white mb-4">Verify Certificate</h2>
        <p class="text-slate-500">Enter the unique 8-character verification code found at the bottom of the certificate.</p>
    </div>

    <div class="w-full max-w-lg bg-white dark:bg-slate-800 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-700/50 p-8 md:p-10">
        
        <form id="verify-form" class="space-y-6">
            <div>
                <label for="verify-code" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Verification Code</label>
                <input type="text" id="verify-code" required class="w-full h-14 px-5 text-center text-2xl tracking-[0.2em] font-mono font-bold uppercase rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all placeholder:text-slate-300 dark:placeholder:text-slate-600" placeholder="A1B2C3D4" maxlength="8">
            </div>
            <button type="submit" id="verify-btn" class="w-full h-14 bg-primary hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-primary/30 transition-all flex items-center justify-center gap-2 text-lg">
                <span class="material-symbols-outlined">search</span> Verify Now
            </button>
        </form>

        <div id="loading-state" class="hidden mt-8 text-center text-slate-400">
            <span class="material-symbols-outlined animate-spin text-3xl">sync</span>
            <p class="text-sm font-medium mt-2">Connecting to secure ledger...</p>
        </div>

        <div id="result-container" class="mt-8 hidden">
            <!-- Results injected here -->
        </div>

    </div>

    <script type="module" src="./verify.js"></script>
</body>
</html>
