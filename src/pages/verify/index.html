<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123E8A">
<meta name="description" content="Verify the authenticity of a Tacliimi certificate.">
<title>Tacliimi — Verify Certificate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#123E8A;--primary-dark:#0D2F6B;--accent:#2FA8FF;--ink:#172033;--muted:#64748B;--border:#E2E8F0;--page:#F6F8FC;--success:#0F9F6E;--danger:#D64545;color-scheme:light}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;min-height:100dvh;font-family:Inter,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(47,168,255,.1),transparent 32%),radial-gradient(circle at 100% 100%,rgba(18,62,138,.08),transparent 34%),var(--page);display:flex;align-items:center;justify-content:center;padding:28px 16px}button,input{font:inherit}.page{width:100%;max-width:480px}.brand{display:flex;justify-content:center;margin-bottom:22px}.brand a{display:inline-flex;border-radius:14px;transition:.2s}.brand a:hover{transform:translateY(-1px);opacity:.92}.brand img{display:block;width:auto;height:48px;max-width:190px;object-fit:contain}.card{background:rgba(255,255,255,.97);border:1px solid rgba(226,232,240,.95);border-radius:24px;padding:30px;box-shadow:0 18px 50px rgba(15,23,42,.08)}.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}.icon{width:17px;height:17px;fill:currentColor;flex:0 0 auto}.icon path:first-child{fill:currentColor}.btn-icon{width:21px;height:21px;flex:0 0 auto}.note-icon{width:17px;height:17px;flex:0 0 auto;margin-top:1px}.loading-icon{width:18px;height:18px;flex:0 0 auto}.material-symbols-outlined{font-family:inherit}h1{margin:0;font-family:Outfit,sans-serif;font-size:clamp(30px,7vw,38px);line-height:1.08;letter-spacing:-.025em;color:#0F172A}.intro{margin:12px 0 26px;color:var(--muted);font-size:15px;line-height:1.65}.field-label{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;color:#334155;font-size:13px;font-weight:700}.field-hint{color:#94A3B8;font-weight:500}.code-input{width:100%;height:58px;border:1.5px solid var(--border);border-radius:14px;outline:0;background:#F8FAFC;color:#0F172A;padding:0 16px;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:23px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;transition:.2s}.code-input::placeholder{color:#CBD5E1;letter-spacing:.14em}.code-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(47,168,255,.14)}.code-input:disabled{opacity:.65}.verify-btn{width:100%;min-height:54px;margin-top:14px;border:0;border-radius:14px;background:var(--primary);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:15px;font-weight:800;box-shadow:0 10px 22px rgba(18,62,138,.2);transition:.18s}.verify-btn:hover{background:var(--primary-dark);transform:translateY(-1px)}.verify-btn:disabled{cursor:wait;opacity:.72;transform:none}.privacy-note{display:flex;gap:8px;margin:18px 0 0;color:#7B8798;font-size:12px;line-height:1.5}.loading{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:20px;padding:14px;border-radius:12px;background:#F8FAFC;color:var(--muted);font-size:13px;font-weight:600}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.result{margin-top:22px}.result-card{border-radius:16px;padding:20px;border:1px solid}.result-card.valid{background:#F0FDF7;border-color:#A7E5CC}.result-card.invalid{background:#FFF6F6;border-color:#F2B8B8;text-align:center}.result-header{display:flex;gap:12px;margin-bottom:20px}.result-icon{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}.valid .result-icon{background:var(--success)}.invalid .result-icon{background:var(--danger);margin:0 auto 12px}.result-title{margin:0 0 3px;font-family:Outfit,sans-serif;font-size:19px}.valid .result-title{color:#08734F}.invalid .result-title{color:#B42323}.result-subtitle{margin:0;color:#64748B;font-size:12px;line-height:1.5}.details{display:grid;gap:13px}.detail{padding-top:13px;border-top:1px solid rgba(15,118,110,.12)}.detail-label{margin:0 0 4px;color:#6B8C80;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.detail-value{margin:0;color:#172033;font-size:14px;font-weight:700;line-height:1.45}.dates{display:grid;grid-template-columns:1fr 1fr;gap:14px}.invalid-message{margin:0;color:#B42323;font-size:13px;line-height:1.55}.back-home{display:block;width:max-content;margin:20px auto 0;color:#64748B;text-decoration:none;font-size:13px;font-weight:700}.back-home:hover{color:var(--primary)}.footer{margin-top:18px;text-align:center;color:#94A3B8;font-size:11px}.hidden{display:none!important}@media(max-width:520px){body{align-items:flex-start;padding:24px 14px 32px}.page{margin-top:3vh}.brand{margin-bottom:18px}.brand img{height:42px;max-width:170px}.card{padding:24px 18px 20px;border-radius:20px}h1{font-size:30px}.intro{font-size:14px;margin-bottom:23px}.code-input{height:56px;font-size:20px}.dates{grid-template-columns:1fr;gap:13px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="page">
<div class="brand"><a href="/" aria-label="Go to Tacliimi home"><img src="/public/assets/images/IMG_7454.png" alt="Tacliimi"></a></div>
<section class="card" aria-labelledby="page-title">
<div class="eyebrow"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2 1.2 2.3-.1 1.1 2 2 1.1-.1 2.3 1.2 2-1.2 2 .1 2.3-2 1.1-1.1 2-2.3-.1L12 21l-2-1.2-2.3.1-1.1-2-2-1.1.1-2.3-1.2-2 1.2-2-.1-2.3 2-1.1 1.1-2 2.3.1L12 3z"/><path d="m8.5 12 2.2 2.2 4.8-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Certificate verification</div>
<h1 id="page-title">Verify a certificate</h1>
<p class="intro">Enter the 8-character verification code printed at the bottom of the certificate.</p>
<form id="verify-form" novalidate>
<label class="field-label" for="verify-code"><span>Verification code</span><span class="field-hint">8 characters</span></label>
<input type="text" id="verify-code" class="code-input" required autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" maxlength="8" pattern="[A-Za-z0-9]{8}" placeholder="F497D4DE" aria-describedby="code-help" aria-label="8-character verification code">
<button type="submit" id="verify-btn" class="verify-btn"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Verify certificate</span></button>
</form>
<p id="code-help" class="privacy-note"><svg class="note-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Verification checks the certificate record securely and does not require an account.</p>
<div id="loading-state" class="loading hidden" role="status" aria-live="polite"><svg class="loading-icon spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 5v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Checking certificate...</span></div>
<div id="result-container" class="result hidden" aria-live="polite"></div>
</section>
<a class="back-home" href="/">← Back to Tacliimi</a>
<div class="footer">Tacliimi certificate verification</div>
</main>
<script type="module" src="/src/pages/verify/verify.js"></script>
</body>
</html>
