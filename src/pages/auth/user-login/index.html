<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to Student Login | Tacliimi</title>
    <meta http-equiv="refresh" content="0;url=/src/pages/auth/login/index.html?role=student">
    <script>
        const params = new URLSearchParams(window.location.search);
        params.set('role', 'student');
        window.location.replace('/src/pages/auth/login/index.html?' + params.toString());
    </script>
</head>
<body>
    <p>Redirecting to Student Login… <a href="/src/pages/auth/login/index.html?role=student">Continue to Student Login</a></p>
</body>
</html>
