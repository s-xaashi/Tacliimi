<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authenticating | Tacliimi Learn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #7C3AED;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center">
    <div class="text-center">
        <div class="spinner mx-auto mb-6"></div>
        <h2 class="text-2xl font-bold text-slate-900 mb-2" id="status-title">Authenticating...</h2>
        <p class="text-slate-500" id="status-message">Please wait while we log you in.</p>
        <button id="error-btn" onclick="window.location.href='/src/pages/auth/login-select/index.html'"
            class="hidden mt-6 bg-slate-900 text-white px-6 py-2 rounded-xl text-sm font-semibold hover:bg-slate-800 transition">Return
            to Login</button>
    </div>

    <!-- Load Supabase first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module">
        import { supabase } from '/src/services/supabaseClient.js';

        function showError(msg) {
            document.getElementById('status-title').textContent = 'Authentication Failed';
            document.getElementById('status-title').classList.add('text-red-500');
            document.getElementById('status-message').textContent = msg;
            document.querySelector('.spinner').style.display = 'none';
            document.getElementById('error-btn').classList.remove('hidden');
        }

        async function handleCallback() {
            try {
                // Supabase automatically parses the URL hash on load
                const { data: { session }, error } = await supabase.auth.getSession();

                if (error) throw error;
                if (!session) throw new Error("No active session found.");

                // 1. Determine intended role
                const pendingRole = localStorage.getItem('tacliimi_pending_role') || 'student';
                localStorage.removeItem('tacliimi_pending_role'); // Clean up

                // 2. Check if user already has a profile
                const { data: existingProfile, error: profileError } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();

                let actualRole = pendingRole;

                if (profileError && profileError.code === 'PGRST116') {
                    // Profile does not exist yet. Create it.
                    // (Ensure your triggers allow this or use this exclusively)
                    const { error: insertError } = await supabase
                        .from('profiles')
                        .insert([{
                            id: session.user.id,
                            email: session.user.email,
                            role: pendingRole,
                            full_name: session.user.user_metadata?.full_name || session.user.email.split('@')[0],
                            avatar_url: session.user.user_metadata?.avatar_url || ''
                        }]);

                    if (insertError) {
                        console.error("Profile insertion failed:", insertError);
                        // We continue anyway, they might be blocked later but they are authenticated.
                    }
                } else if (existingProfile) {
                    // Respect their existing role
                    actualRole = existingProfile.role;
                }

                // 3. Route to correct dashboard
                document.getElementById('status-title').textContent = 'Success!';
                document.getElementById('status-message').textContent = 'Redirecting you to your dashboard...';

                setTimeout(() => {
                    if (actualRole === 'instructor') {
                        window.location.replace('/src/pages/instructor/instructor-dashboard/index.html');
                    } else {
                        window.location.replace('/src/pages/student/student-dashboard/index.html');
                    }
                }, 500);

            } catch (err) {
                console.error("Callback handling error:", err);
                showError(err.message || 'An unexpected error occurred during sign-in.');
            }
        }

        // Delay execution slightly to ensure Supabase client has processed the URL hash
        setTimeout(handleCallback, 500);
    </script>
</body>

</html>
