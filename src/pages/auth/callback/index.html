<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authenticating | Tacliimi Learn</title>
    <link rel="stylesheet" href="/public/assets/css/tacliimi.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #7C3AED;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-[#F8FAFC] dark:bg-slate-900 min-h-screen flex items-center justify-center transition-colors">
    <div class="text-center">
        <div class="spinner mx-auto mb-6"></div>
        <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2" id="status-title">Authenticating...</h2>
        <p class="text-slate-500 dark:text-slate-400" id="status-message">Please wait while we log you in.</p>
        <button id="error-btn" onclick="window.location.href='/src/pages/auth/login-select/index.html'"
            class="hidden mt-6 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-6 py-2 rounded-xl text-sm font-semibold hover:bg-slate-800 dark:hover:bg-white transition">Return
            to Login</button>
    </div>

    <!-- Configure Tailwind for Dark Mode -->
    

    <script type="module">
        import { supabase } from '/src/services/supabaseClient.js';

        // Deduplication flag to prevent both getSession and onAuthStateChange from triggering the callback
        let initialized = false;

        function showError(msg) {
            document.getElementById('status-title').textContent = 'Authentication Failed';
            document.getElementById('status-title').classList.add('text-red-500');
            document.getElementById('status-message').textContent = msg;
            document.querySelector('.spinner').style.display = 'none';
            document.getElementById('error-btn').classList.remove('hidden');
        }

        async function handleCallback(session) {
            if (initialized) return;
            initialized = true;

            try {
                if (!session) throw new Error("No active session found.");

                // 1. Read the role selected by the page that initiated this OAuth flow.
                // Privileged roles must be created via trusted backend API flows, not raw OAuth metadata.
                const pendingRole = sessionStorage.getItem('tacliimi_pending_role') || 'student';
                const requestedRole = pendingRole === 'mentor' ? 'instructor' : pendingRole;

                sessionStorage.removeItem('tacliimi_pending_role');
                localStorage.removeItem('tacliimi_pending_role');

                // 2. Fetch authoritative profile from the database
                const { data: existingProfile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .maybeSingle();

                let actualRole;

                if (profileError && profileError.code !== 'PGRST116') {
                     throw new Error("Unable to verify user profile.");
                }

                if (!existingProfile) {
                    // Profile does not exist yet. Create it using the pendingRole intent.
                    const { error: insertError } = await supabase
                        .from('profiles')
                        .insert([{
                            id: session.user.id,
                            email: session.user.email,
                            role: requestedRole,
                            full_name: session.user.user_metadata?.full_name || session.user.email.split('@')[0],
                            avatar_url: session.user.user_metadata?.avatar_url || ''
                        }]);

                    if (insertError) {
                        console.error("Profile insertion failed:", insertError);
                        window.location.replace('/src/pages/auth/login-select/index.html?error=profile_creation_failed');
                        return;
                    }
                    actualRole = requestedRole;
                } else {
                    // Existing OAuth account: database role always wins.
                    actualRole = existingProfile.role;

                    const allowedForRequest = requestedRole === 'instructor'
                        ? ['instructor', 'mentor', 'admin']
                        : ['student', 'admin'];

                    if (!allowedForRequest.includes(actualRole)) {
                        await supabase.auth.signOut();

                        const correctPage = actualRole === 'instructor' || actualRole === 'mentor'
                            ? '/src/pages/auth/instructor-login/index.html'
                            : '/src/pages/auth/login/index.html?role=student';

                        showError(
                            actualRole === 'instructor' || actualRole === 'mentor'
                                ? 'This Google account belongs to an instructor. Please use Instructor Login.'
                                : 'This Google account belongs to a student. Please use Student Login.'
                        );

                        setTimeout(() => window.location.replace(correctPage), 1800);
                        return;
                    }
                }

                document.getElementById('status-title').textContent = 'Success!';
                document.getElementById('status-message').textContent = 'Redirecting to your dashboard...';

                // 3. Route to correct dashboard instantly
                if (actualRole === 'instructor' || actualRole === 'mentor') {
                    window.location.replace('/src/pages/instructor/instructor-dashboard/index.html');
                } else if (actualRole === 'admin') {
                    window.location.replace('/src/pages/admin/dashboard/index.html');
                } else {
                    window.location.replace('/src/pages/student/student-dashboard/index.html');
                }

            } catch (err) {
                console.error("Callback handling error:", err);
                showError(err.message || 'An unexpected error occurred during sign-in.');
            }
        }

        // Try getting session immediately
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) handleCallback(session);
        });

        // Fallback or catch the intent if getSession happens too early
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session) {
                handleCallback(session);
            }
        });
    </script>
</body>

</html>
