<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Instructor Login | Tacliimi Learn</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#7C3AED", // Vibrant Purple
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>
</head>

<body
    class="bg-[#F3F4F6] text-[#1F2937] min-h-screen flex items-center justify-center p-6 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <div
        class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-8 md:p-12 relative overflow-hidden">
        <!-- Decorative bg blob -->
        <div class="absolute -top-16 -right-16 w-48 h-48 bg-purple-100 rounded-full blur-3xl opacity-60"></div>

        <div class="relative z-10">
            <div class="flex items-center justify-center gap-2 mb-8 cursor-pointer"
                onclick="window.location.href='/index.html'">
                <div
                    class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center shadow-lg shadow-primary/30">
                    <span class="material-icons-round text-white">school</span>
                </div>
                <span class="text-2xl font-bold tracking-tight text-slate-900">Tacliimi<span
                        class="text-primary">Learn</span></span>
            </div>

            <div class="mb-10 text-center">
                <h1 class="text-2xl font-extrabold mb-2">Welcome Back, Instructor</h1>
                <p class="text-slate-500 text-sm">Log in to manage your courses and students.</p>
            </div>

            <form id="instructorLoginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold mb-2" for="email">Email Address</label>
                    <input
                        class="w-full bg-slate-50 border-slate-200 rounded-xl px-4 py-3.5 focus:ring-primary focus:border-primary transition-all text-slate-900 placeholder:text-slate-400"
                        id="email" placeholder="example@gmail.com" type="email" value="" required />
                </div>
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-semibold" for="password">Password</label>
                        <a href="/src/pages/auth/forgot-password/index.html"
                            class="text-xs text-primary font-semibold hover:underline">Forgot password?</a>
                    </div>
                    <input
                        class="w-full bg-slate-50 border-slate-200 rounded-xl px-4 py-3.5 focus:ring-primary focus:border-primary transition-all text-slate-900 placeholder:text-slate-400"
                        id="password" type="password" value="" required />
                </div>

                <button
                    class="w-full bg-primary hover:bg-purple-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all transform hover:-translate-y-0.5 mt-8 flex items-center justify-center gap-2"
                    type="submit">
                    Log In to Dashboard <span class="material-icons-round text-xl">arrow_forward</span>
                </button>
            </form>

            <script src="/src/services/tacliimi_db.js"></script>
            <script>
                // Prevent access if already logged in as instructor
                const session = TacliimiDB.getCurrentSession();
                if (session && session.role === 'instructor') {
                    window.location.href = '/src/pages/instructor/instructor-dashboard/index.html';
                }

                document.getElementById('instructorLoginForm').addEventListener('submit', (e) => {
                    e.preventDefault();

                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const btn = e.target.querySelector('button[type="submit"]');
                    const originalText = btn.innerHTML;

                    try {
                        btn.innerText = 'Verifying...';

                        // Log them in
                        let sessionUser = TacliimiDB.loginUser(email, password);

                        // If they are a student, upgrade them to an instructor because they logged in via the instructor portal
                        if (sessionUser.role !== 'instructor') {
                            TacliimiDB.updateProfileInfo({ role: 'instructor' });
                            sessionUser.role = 'instructor';
                        }

                        if (sessionUser) {
                            btn.innerHTML = 'Success <span class="material-icons-round text-xl">check</span>';
                            btn.classList.replace('bg-primary', 'bg-green-500');
                            setTimeout(() => {
                                window.location.href = '/src/pages/instructor/instructor-dashboard/index.html';
                            }, 500);
                        }
                    } catch (err) {
                        btn.innerHTML = originalText;

                        // Clear existing errors
                        const oldErr = document.getElementById('login-error');
                        if (oldErr) oldErr.remove();

                        const errDiv = document.createElement('div');
                        errDiv.id = 'login-error';
                        errDiv.className = 'text-red-500 text-sm font-medium mt-2 p-3 bg-red-50 rounded-lg border border-red-100 flex items-center gap-2';
                        errDiv.innerHTML = `<span class="material-icons-round text-lg">error_outline</span> ${err.message}`;

                        e.target.insertBefore(errDiv, e.target.querySelector('button[type="submit"]'));
                    }
                });
            </script>

            <div class="mt-8 text-center border-t border-slate-100 pt-8">
                <p class="text-slate-500 text-sm">
                    Don't have an instructor account?
                    <a class="text-primary font-bold hover:underline ml-1" href="/src/pages/auth/instructor-register/index.html">Sign
                        up here</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
