<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Instructor Login | Tacliimi Learn</title>
    <link rel="stylesheet" href="/public/assets/css/tacliimi.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    
</head>

<body
    class="bg-[#F3F4F6] text-[#1F2937] min-h-screen flex items-center justify-center p-6 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <div
        class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-8 md:p-12 relative overflow-hidden">
        <!-- Decorative bg blob -->
        <div class="absolute -top-16 -right-16 w-48 h-48 bg-purple-100 rounded-full blur-3xl opacity-60"></div>

        <div class="relative z-10">
            <div class="flex items-center justify-center mb-8 cursor-pointer"
                onclick="window.location.href='/index.html'">
                <img src="/public/assets/images/IMG_7454.png" alt="Tacliimi" class="h-16 w-auto mx-auto object-contain dark:hidden">
                <img src="/public/assets/images/logo-dark.png" alt="Tacliimi" class="h-16 w-auto mx-auto object-contain hidden dark:block">
            </div>

            <div class="mb-10 text-center">
                <h1 class="text-2xl font-extrabold mb-2">Welcome Back, Instructor</h1>
                <p class="text-slate-500 text-sm">Log in to manage your courses and students.</p>
            </div>

            <button type="button" id="google-login-btn"
                class="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold py-3.5 rounded-xl transition-all shadow-sm mb-6">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                Sign in with Google
            </button>

            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 text-sm">Or continue with email</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <form id="instructorLoginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold mb-2" for="email">Email address</label>
                    <input
                        class="w-full bg-slate-50 border-slate-200 rounded-xl px-4 py-3.5 focus:ring-primary focus:border-primary transition-all text-slate-900 placeholder:text-slate-400"
                        id="email" type="email" placeholder="you@institution.edu" required />
                </div>
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-semibold" for="password">Password</label>
                        <a href="/src/pages/auth/forgot-password/index.html"
                            class="text-xs text-primary font-semibold hover:underline">Forgot password?</a>
                    </div>
                    <input
                        class="w-full bg-slate-50 border-slate-200 rounded-xl px-4 py-3.5 focus:ring-primary focus:border-primary transition-all text-slate-900 placeholder:text-slate-400"
                        id="password" type="password" value="" required />
                </div>

                <button
                    class="w-full bg-primary hover:bg-purple-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all transform hover:-translate-y-0.5 mt-8 flex items-center justify-center gap-2"
                    type="submit">
                    Log In to Dashboard <span class="material-icons-round text-xl">arrow_forward</span>
                </button>
            </form>

            <script type="module">
                import { AuthService } from '/src/services/authService.js';
                import { supabase } from '/src/services/supabaseClient.js';

                // Prevent access if already logged in
                AuthService.getSession().then(async session => {
                    if (session) {
                        const profile = await AuthService.getCurrentProfile();
                        if (profile && profile.is_admin === true) {
                            window.location.href = '/src/pages/admin/dashboard/index.html';
                        } else if (profile && profile.role === 'instructor') {
                            window.location.href = '/src/pages/instructor/instructor-dashboard/index.html';
                        } else {
                            window.location.href = '/src/pages/student/student-dashboard/index.html';
                        }
                    }
                });

                // Google OAuth Flow
                document.getElementById('google-login-btn').addEventListener('click', async () => {
                    const btn = document.getElementById('google-login-btn');
                    btn.innerHTML = '<span aria-hidden="true" class="inline-block h-5 w-5 animate-spin rounded-full border-2 border-slate-300 border-t-slate-700 mr-2"></span> Connecting...';
                    try {
                        await AuthService.signInWithGoogle('instructor');
                    } catch (err) {
                        btn.innerHTML = `<img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5"> Sign in with Google`;
                        alert("Google Sign-In failed: " + err.message);
                    }
                });

                document.getElementById('instructorLoginForm').addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const btn = e.target.querySelector('button[type="submit"]');
                    const originalText = btn.innerHTML;

                    // Clear existing errors
                    const oldErr = document.getElementById('login-error');
                    if (oldErr) oldErr.remove();

                    try {
                        btn.innerText = 'Verifying...';
                        btn.disabled = true;

                        // Log them in via Supabase
                        const data = await AuthService.login(email, password);
                        const profile = await AuthService.getCurrentProfile();

                        // Enforce Role Separation: Reject student accounts trying to log in on Instructor page
                        if (profile && profile.role === 'student') {
                            await supabase.auth.signOut();
                            
                            const errDiv = document.createElement('div');
                            errDiv.id = 'login-error';
                            errDiv.className = 'text-red-600 text-sm font-medium mt-2 p-3 bg-red-50 rounded-xl border border-red-200 flex items-center gap-2';
                            errDiv.innerHTML = `<span class="material-icons-round text-lg text-red-500">error_outline</span> Student accounts cannot log in on the Instructor Login page. Redirecting to Student Login...`;
                            e.target.insertBefore(errDiv, btn);

                            btn.innerText = 'Redirecting to Student Login...';
                            btn.disabled = true;
                            setTimeout(() => {
                                window.location.href = '/src/pages/auth/user-login/index.html';
                            }, 1500);
                            return;
                        }

                        // Admin Redirection
                        if (profile && profile.is_admin === true) {
                            btn.innerHTML = 'Admin Success <span class="material-icons-round text-xl">check</span>';
                            btn.classList.replace('bg-primary', 'bg-emerald-500');
                            setTimeout(() => {
                                window.location.href = '/src/pages/admin/dashboard/index.html';
                            }, 500);
                            return;
                        }

                        btn.innerHTML = 'Success <span class="material-icons-round text-xl">check</span>';
                        btn.classList.replace('bg-primary', 'bg-green-500');
                        setTimeout(() => {
                            window.location.href = '/src/pages/instructor/instructor-dashboard/index.html';
                        }, 500);

                    } catch (err) {
                        btn.innerHTML = originalText;
                        btn.disabled = false;

                        const errDiv = document.createElement('div');
                        errDiv.id = 'login-error';
                        errDiv.className = 'text-red-500 text-sm font-medium mt-2 p-3 bg-red-50 rounded-lg border border-red-100 flex items-center gap-2';
                        errDiv.innerHTML = `<span class="material-icons-round text-lg">error_outline</span> ${err.message}`;

                        e.target.insertBefore(errDiv, btn);
                    }
                });
            </script>

            <div class="mt-8 text-center border-t border-slate-100 pt-8">
                <p class="text-slate-500 text-sm">
                    Don't have an instructor account?
                    <a class="text-primary font-bold hover:underline ml-1"
                        href="/src/pages/auth/instructor-register/index.html">Sign
                        up here</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
