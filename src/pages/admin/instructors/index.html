<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Instructor Management | Tacliimi Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script type="module" src="/src/services/globalProfile.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { primary: "#4F46E5", "background-light": "#F9FAFB", "background-dark": "#111827" },
                    fontFamily: { display: ["Inter", "sans-serif"] }
                }
            }
        };
    </script>
    <style type="text/tailwindcss">
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .table-row-hover { @apply hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors; }
    </style>

    <script type="module">
        import { AuthService } from '/src/services/authService.js';
        const session = await AuthService.getSession();
        if (!session || !session.is_admin) {
            window.location.replace('/src/pages/auth/login-select/index.html');
        }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col z-30 transition-transform -translate-x-full lg:translate-x-0">
        <div class="p-8 pb-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='/index.html'">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200 dark:shadow-none">
                    <span class="material-symbols-outlined text-white text-2xl">admin_panel_settings</span>
                </div>
                <span class="text-2xl font-black tracking-tighter text-slate-900 dark:text-white">TACLIIMI<span class="text-indigo-600">.</span></span>
            </div>
        </div>

        <nav class="flex-1 p-6 space-y-2 overflow-y-auto mt-4">
            <a href="/src/pages/admin/dashboard/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0" style="font-variation-settings:'FILL' 0;">dashboard</span>
                Dashboard
            </a>
            <a href="/src/pages/admin/courses-review/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0 group-hover:scale-110 transition-transform">rule</span>
                Courses Review
            </a>
            <a href="/src/pages/admin/users/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0" style="font-variation-settings:'FILL' 0;">group</span>
                Users
            </a>
            <a href="/src/pages/admin/instructors/index.html" class="flex items-center gap-3 px-4 py-3 bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-400 font-bold rounded-xl ring-1 ring-indigo-500/10">
                <span class="material-symbols-outlined shrink-0" style="font-variation-settings:'FILL' 1;">school</span>
                Instructors
            </a>
            <a href="/src/pages/admin/categories/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0 group-hover:scale-110 transition-transform">category</span>
                Categories
            </a>
            <div class="h-px bg-slate-200 dark:bg-slate-800 my-4 mx-4"></div>
            <a href="/src/pages/admin/admin-management/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0 group-hover:scale-110 transition-transform">manage_accounts</span>
                Admin Management
            </a>
            <a href="/src/pages/admin/settings/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0 group-hover:scale-110 transition-transform">settings</span>
                Settings
            </a>
        </nav>

        <div class="p-6 border-t border-slate-100 dark:border-slate-800">
            <button id="logout-btn" class="flex items-center justify-center gap-2 w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-900/20 text-slate-600 dark:text-slate-400 hover:text-red-600 dark:hover:text-red-400 font-bold rounded-xl transition-all border border-transparent hover:border-red-100 dark:hover:border-red-900/50">
                <span class="material-symbols-outlined">logout</span>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="lg:ml-72 min-h-screen flex flex-col transition-all duration-300">
        <!-- Header -->
        <header class="h-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-8 sticky top-0 z-10 w-full">
            <div class="flex items-center gap-4">
                <button id="toggle-sidebar" class="lg:hidden p-2.5 text-slate-500 bg-slate-100 dark:bg-slate-800 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    <span class="material-symbols-outlined">menu_open</span>
                </button>
                <div>
                    <h2 class="text-xl font-black tracking-tight text-slate-900 dark:text-white">Instructor Network</h2>
                    <p class="text-xs text-slate-400 font-medium tracking-wide">Protocol: Faculty Verification</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="w-10 h-10 flex items-center justify-center text-slate-500 bg-slate-100 dark:bg-slate-800 rounded-xl hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-all">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 p-8 lg:p-12 max-w-[1600px] mx-auto w-full">
            <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 dark:bg-slate-800/50">
                            <th class="px-6 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Author</th>
                            <th class="px-6 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Bio</th>
                            <th class="px-6 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Courses & Metrics</th>
                            <th class="px-6 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Status</th>
                            <th class="px-6 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="instructor-table-body" class="divide-y divide-slate-100 dark:divide-slate-800">
                        <tr><td colspan="5" class="py-20 text-center"><div class="w-8 h-8 border-4 border-slate-200 border-t-indigo-600 rounded-full animate-spin mx-auto"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from '/src/services/supabaseClient.js';
        import { AuthService } from '/src/services/authService.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const tableBody = document.getElementById('instructor-table-body');

            async function fetchInstructors() {
                try {
                    const { data, error } = await supabase.from('instructors').select('*, profiles:user_id (id, full_name, avatar_url, email, created_at, short_bio)');
        if(data) {
            data.forEach(d => {
                d.id = d.user_id;
                d.full_name = d.profiles?.full_name;
                d.short_bio = d.profiles?.short_bio;
                d.avatar_url = d.profiles?.avatar_url;
                d.email = d.profiles?.email;
                d.created_at = d.profiles?.created_at;
                d.course_count = d.total_courses_created;
                d.courses_list = [];
            });
        }
                    
                    if (error) throw error;
                    renderInstructors(data || []);
                } catch (e) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-10 text-center text-red-500 font-bold">${e.message}</td></tr>`;
                }
            }

            function renderInstructors(list) {
                tableBody.innerHTML = '';
                if(list.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-10 text-center text-slate-500 italic">No instructors found in database.</td></tr>`;
                    return;
                }

                list.forEach(inst => {
                    const row = document.createElement('tr');
                    row.className = 'table-row-hover';
                    
                    const avatar = inst.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(inst.full_name || 'I')}`;
                    const bio = inst.short_bio || 'No bio provided.';
                    const courseCount = inst.course_count || 0;
                    
                    // Format course list snippet
                    let courseSnippet = 'No courses yet.';
                    if (inst.courses_list && inst.courses_list.length > 0) {
                        const titles = inst.courses_list.slice(0, 2).map(c => c.title).join(', ');
                        courseSnippet = titles + (inst.courses_list.length > 2 ? '...' : '');
                    }

                    row.innerHTML = `
                        <td class="px-6 py-5">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-2xl overflow-hidden bg-slate-100 dark:bg-slate-800 ring-2 ring-transparent group-hover:ring-indigo-500 transition-all shadow-sm">
                                    <img src="${avatar}" class="w-full h-full object-cover">
                                </div>
                                <div class="max-w-[150px]">
                                    <p class="text-sm font-black text-slate-900 dark:text-white leading-tight truncate" title="${inst.full_name}">${inst.full_name || 'Expert'}</p>
                                    <p class="text-[10px] font-bold text-slate-400 truncate">${inst.email}</p>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-5">
                            <div class="max-w-xs">
                                <p class="text-[11px] font-bold text-slate-600 dark:text-slate-300 line-clamp-2 leading-relaxed">${bio}</p>
                            </div>
                        </td>
                        <td class="px-6 py-5">
                            <div class="flex flex-col gap-1">
                                <div class="flex items-center gap-2">
                                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                                    <span class="text-xs font-black text-slate-900 dark:text-white">${courseCount} Course${courseCount !== 1 ? 's' : ''}</span>
                                </div>
                                <p class="text-[10px] text-slate-400 italic truncate max-w-[180px]">${courseSnippet}</p>
                            </div>
                        </td>
                        <td class="px-6 py-5">
                            <span class="text-[9px] font-black uppercase tracking-widest px-2.5 py-1 rounded-lg ${inst.approval_status === 'approved' ? 'bg-emerald-50 text-emerald-600' : 'bg-orange-50 text-orange-600'}">
    ${inst.approval_status || 'Pending'}
</span>
                        </td>
                        <td class="px-6 py-5 text-right">
                            
<div class="flex gap-2 justify-end">
    <button onclick="window.updateStatus('${inst.id}', 'approved')" class="px-3 py-1 bg-emerald-50 text-emerald-600 text-[10px] font-black rounded-lg">Approve</button>
    <button onclick="window.updateStatus('${inst.id}', 'blocked')" class="px-3 py-1 bg-red-50 text-red-600 text-[10px] font-black rounded-lg">Block</button>
</div>

                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            // Standard behaviors
            document.getElementById('logout-btn')?.addEventListener('click', async () => { await AuthService.logout(); window.location.href = '/src/pages/auth/login-select/index.html'; });
            const toggleBtn = document.getElementById('toggle-sidebar');
            const sidebar = document.getElementById('sidebar');
            toggleBtn?.addEventListener('click', () => { sidebar.classList.toggle('-translate-x-full'); });
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle?.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                themeToggle.innerHTML = `<span class="material-symbols-outlined">${isDark ? 'light_mode' : 'dark_mode'}</span>`;
            });

            
            window.updateStatus = async (userId, targetStatus) => {
                await supabase.from('instructors').update({ approval_status: targetStatus }).eq('user_id', userId);
                fetchInstructors();
            };
            fetchInstructors()

        });
    </script>
</body>
</html>
