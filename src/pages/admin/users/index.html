<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>User Management | Tacliimi Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script type="module" src="/src/services/globalProfile.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { primary: "#4F46E5", "background-light": "#F9FAFB", "background-dark": "#111827" },
                    fontFamily: { display: ["Inter", "sans-serif"] }
                }
            }
        };
    </script>
    <style type="text/tailwindcss">
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .table-row-hover { @apply hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors; }
    </style>

    <script type="module">
        import { AuthService } from '/src/services/authService.js';
        const session = await AuthService.getSession();
        if (!session || !session.is_admin) {
            window.location.replace('/src/pages/auth/login-select/index.html');
        }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-20 hidden lg:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col z-30 transition-transform -translate-x-full lg:translate-x-0">
        <div class="p-8 pb-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='/index.html'">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200 dark:shadow-none">
                    <span class="material-symbols-outlined text-white text-2xl">admin_panel_settings</span>
                </div>
                <span class="text-2xl font-black tracking-tighter text-slate-900 dark:text-white">TACLIIMI<span class="text-indigo-600">.</span></span>
            </div>
            <div class="mt-2 px-1">
                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Admin Control</span>
            </div>
        </div>

        <nav class="flex-1 p-6 space-y-2 overflow-y-auto mt-4">
            <a href="/src/pages/admin/dashboard/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0" style="font-variation-settings:'FILL' 0;">dashboard</span>
                Dashboard
            </a>
            <a href="/src/pages/admin/courses-review/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0 group-hover:scale-110 transition-transform">rule</span>
                Courses Review
            </a>
            <a href="/src/pages/admin/users/index.html" class="flex items-center gap-3 px-4 py-3 bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-400 font-bold rounded-xl ring-1 ring-indigo-500/10">
                <span class="material-symbols-outlined shrink-0" style="font-variation-settings:'FILL' 1;">group</span>
                Users
            </a>
            <a href="/src/pages/admin/instructors/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0 group-hover:scale-110 transition-transform">school</span>
                Instructors
            </a>
            <a href="/src/pages/admin/categories/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0 group-hover:scale-110 transition-transform">category</span>
                Categories
            </a>
            <div class="h-px bg-slate-100 dark:bg-slate-800 my-4 mx-4"></div>
            <a href="/src/pages/admin/admin-management/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0 group-hover:scale-110 transition-transform">manage_accounts</span>
                Admin Management
            </a>
            <a href="/src/pages/admin/settings/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all group font-medium">
                <span class="material-symbols-outlined shrink-0 group-hover:scale-110 transition-transform">settings</span>
                Settings
            </a>
        </nav>

        <div class="p-6 border-t border-slate-100 dark:border-slate-800">
            <button id="logout-btn" class="flex items-center justify-center gap-2 w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-900/20 text-slate-600 dark:text-slate-400 hover:text-red-600 dark:hover:text-red-400 font-bold rounded-xl transition-all border border-transparent hover:border-red-100 dark:hover:border-red-900/50">
                <span class="material-symbols-outlined">logout</span>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="lg:ml-72 min-h-screen flex flex-col transition-all duration-300">
        <!-- Header -->
        <header class="h-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-8 sticky top-0 z-10 w-full">
            <div class="flex items-center gap-4">
                <button id="toggle-sidebar" class="lg:hidden p-2.5 text-slate-500 bg-slate-100 dark:bg-slate-800 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    <span class="material-symbols-outlined">menu_open</span>
                </button>
                <div>
                    <h2 class="text-xl font-black tracking-tight text-slate-900 dark:text-white">User Management</h2>
                    <p class="text-xs text-slate-400 font-medium tracking-wide">Protocol: Registry Oversight</p>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="relative hidden sm:block">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">search</span>
                    <input type="text" id="user-search" placeholder="Search users..." class="pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-xl text-xs font-medium focus:ring-2 focus:ring-indigo-500 transition-all w-64">
                </div>
                <button id="theme-toggle" class="w-10 h-10 flex items-center justify-center text-slate-500 bg-slate-100 dark:bg-slate-800 rounded-xl hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-all">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 p-8 lg:p-12 max-w-[1600px] mx-auto w-full">
            <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 dark:bg-slate-800/50">
                                <th class="px-6 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">User Profile</th>
                                <th class="px-6 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Identity/Role</th>
                                <th class="px-6 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Status</th>
                                <th class="px-6 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Joined Date</th>
                                <th class="px-6 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body" class="divide-y divide-slate-100 dark:divide-slate-800">
                            <!-- Skeleton Rows -->
                            <tr class="animate-pulse"><td colspan="5" class="px-6 py-8 h-20 bg-slate-50/50 dark:bg-slate-800/20"></td></tr>
                            <tr class="animate-pulse"><td colspan="5" class="px-6 py-8 h-20 bg-slate-50/50 dark:bg-slate-800/20 opacity-50"></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from '/src/services/supabaseClient.js';
        import { AuthService } from '/src/services/authService.js';

        let allUsers = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const tableBody = document.getElementById('user-table-body');
            const searchInput = document.getElementById('user-search');

            // Load Profile Info (Consistency)
            const profile = await AuthService.getCurrentProfile();

            async function fetchUsers() {
                try {
                    const { data, error } = await supabase.from('students').select('account_status, user_id, profiles:user_id (id, full_name, avatar_url, email, created_at)');
        if(data) {
            data.forEach(d => {
                d.id = d.user_id;
                d.full_name = d.profiles?.full_name;
                d.avatar_url = d.profiles?.avatar_url;
                d.email = d.profiles?.email;
                d.created_at = d.profiles?.created_at;
                d.role = 'student';
                d.status = d.account_status;
            });
        }
                    
                    if (error) throw error;
                    allUsers = data;
                    renderUsers(allUsers);
                } catch (e) {
                    console.error("Failed to fetch users:", e);
                    tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-10 text-center text-red-500 font-bold">Protocol Error: ${e.message}</td></tr>`;
                }
            }

            function renderUsers(users) {
                tableBody.innerHTML = '';
                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.className = 'table-row-hover';
                    
                    const roleColors = {
                        student: 'text-blue-600 bg-blue-50 dark:bg-blue-900/20',
                        instructor: 'text-emerald-600 bg-emerald-50 dark:bg-emerald-900/20',
                        admin: 'text-indigo-600 bg-indigo-50 dark:bg-indigo-900/20'
                    };

                    const date = new Date(user.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                    const avatar = user.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.full_name || 'User')}`;

                    row.innerHTML = `
                        <td class="px-6 py-5">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800">
                                    <img src="${avatar}" class="w-full h-full object-cover">
                                </div>
                                <div>
                                    <p class="text-sm font-bold text-slate-900 dark:text-white leading-tight">${user.full_name || 'Anonymous'}</p>
                                    <p class="text-[10px] font-medium text-slate-400">${user.email}</p>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-5">
                            <span class="text-[10px] font-black uppercase tracking-widest px-2.5 py-1 rounded-lg ${roleColors[user.role] || 'bg-slate-100 text-slate-500'}">
                                ${user.role}
                            </span>
                        </td>
                        <td class="px-6 py-5">
                            <div class="flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full ${user.status === 'blocked' ? 'bg-orange-500' : 'bg-emerald-500'}"></span>
                                <span class="text-xs font-bold text-slate-600 dark:text-slate-300">${(user.status || "active").toUpperCase()}</span>
                            </div>
                        </td>
                        <td class="px-6 py-5">
                            <span class="text-xs font-medium text-slate-500">${date}</span>
                        </td>
                        <td class="px-6 py-5 text-right">
                            <div class="flex items-center justify-end gap-2">
                                
<button onclick="window.toggleUserBlock('${user.id}', '${user.status === 'blocked' ? 'active' : 'blocked'}')" class="p-2 ${user.status === 'blocked' ? 'text-orange-500 hover:text-orange-600' : 'text-slate-400 hover:text-orange-500'} hover:bg-orange-50 dark:hover:bg-orange-900/20 rounded-lg transition-all" title="${user.status === 'blocked' ? 'Unblock' : 'Block'}">
    <span class="material-symbols-outlined text-[20px]">${user.status === 'blocked' ? 'lock_open' : 'block'}</span>
</button>
<button onclick="window.deleteUser('${user.id}')" class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-all" title="Delete">
    <span class="material-symbols-outlined text-[20px]">delete</span>
</button>

                            </div>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allUsers.filter(u => 
                    (u.full_name || '').toLowerCase().includes(term) || 
                    u.email.toLowerCase().includes(term)
                );
                renderUsers(filtered);
            });

            // Theme Toggle (Consistency)
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle?.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                themeToggle.innerHTML = `<span class="material-symbols-outlined">${isDark ? 'light_mode' : 'dark_mode'}</span>`;
            });

            // Mobile Menu Toggle (Consistency)
            const toggleBtn = document.getElementById('toggle-sidebar');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            toggleBtn?.addEventListener('click', () => { sidebar.classList.toggle('-translate-x-full'); overlay.classList.toggle('hidden'); });
            overlay?.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); });

            // Logout
            document.getElementById('logout-btn')?.addEventListener('click', async () => {
                await AuthService.logout();
                window.location.href = '/src/pages/auth/login-select/index.html';
            });

            
            window.toggleUserBlock = async (userId, targetStatus) => {
                try {
                    await supabase.from('students').update({ account_status: targetStatus }).eq('user_id', userId);
                    fetchUsers();
                } catch(e) { alert(e.message) }
            };
            window.deleteUser = async (userId) => {
                if(!confirm('Delete this user completely across auth, profiles, and students?')) return;
                try {
                    const session = await AuthService.getSession();
                    const res = await fetch('https://jboruccxbgdqntrggslz.supabase.co/functions/v1/delete-user', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + session.session.access_token, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id_to_delete: userId })
                    });
                    if(!res.ok) throw new Error(await res.text());
                    fetchUsers();
                } catch(e) { alert(e.message) }
            };
            fetchUsers()

        });
    </script>
</body>
</html>
