<div class="p-8 md:p-12 bg-white">
    <div class="max-w-2xl mx-auto">
        <div class="text-center mb-10">
            <h3 class="text-2xl font-bold text-slate-900">Join the Mentorship Program</h3>
            <p class="text-slate-500 mt-2">
                Apply now to become a mentor and guide students through their learning journey.
            </p>
        </div>
        <div class="bg-slate-50 rounded-2xl p-8 border border-slate-100">
            <form class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2"
                            for="full-name">Full Name</label>
                        <input
                            class="w-full bg-white border-slate-200 rounded-xl py-3 px-4 text-sm focus:border-brand-purple focus:ring-brand-purple transition-all"
                            id="full-name" placeholder="Full Name" type="text" value="John Doe" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2"
                            for="email">Gmail Address</label>
                        <input
                            class="w-full bg-white border-slate-200 rounded-xl py-3 px-4 text-sm focus:border-brand-purple focus:ring-brand-purple transition-all"
                            id="email" placeholder="example@gmail.com" type="email" value="example@gmail.com" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2"
                            for="phone">Phone Number</label>
                        <input
                            class="w-full bg-white border-slate-200 rounded-xl py-3 px-4 text-sm focus:border-brand-purple focus:ring-brand-purple transition-all"
                            id="phone" placeholder="1234567890" type="tel" value="1234567890" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2"
                            for="country">Country</label>
                        <input
                            class="w-full bg-white border-slate-200 rounded-xl py-3 px-4 text-sm focus:border-brand-purple focus:ring-brand-purple transition-all"
                            id="country" placeholder="Country" type="text" value="Somalia" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2"
                            for="city">City</label>
                        <input
                            class="w-full bg-white border-slate-200 rounded-xl py-3 px-4 text-sm focus:border-brand-purple focus:ring-brand-purple transition-all"
                            id="city" placeholder="City" type="text" value="Mogadishu" />
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2"
                            for="gender">Gender</label>
                        <select
                            class="w-full bg-white border-slate-200 rounded-xl py-3 px-4 text-sm focus:border-brand-purple focus:ring-brand-purple transition-all appearance-none"
                            id="gender">
                            <option disabled="">Select Gender</option>
                            <option selected="" value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <button id="start-mentorship-application-btn" type="button"
                    class="w-full flex items-center justify-center gap-3 px-8 py-4 bg-brand-purple hover:bg-brand-purple/90 text-white font-bold rounded-xl transition-all shadow-lg shadow-brand-purple/20 mt-8 group">
                    <span>Start Application</span>
                    <span
                        class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </button>
                <div class="pt-6 mt-6 border-t border-slate-200/60">
                    <p class="text-slate-400 text-[11px] leading-relaxed italic text-center">
                        Mentorship on Tacliimi is about closer learning. Our mentors must be willing to teach both
                        online and in-person.
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
