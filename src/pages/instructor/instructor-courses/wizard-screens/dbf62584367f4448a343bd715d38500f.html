<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Course Creation: Curriculum Builder - Tacliimi Learn</title>
    <link rel="stylesheet" href="/public/assets/css/tacliimi.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    
    
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
    <nav class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <div class="bg-primary p-1.5 rounded-lg text-white flex items-center">
                        <span class="material-symbols-outlined text-2xl">school</span>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-primary">Tacliimi Learn</span>
                </div>
                <div class="flex items-center gap-4">
                    <button
                        class="text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-medium text-sm">Save
                        Draft</button>
                    <button
                        class="bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-2 rounded-md font-semibold text-sm hover:bg-slate-200 dark:hover:bg-slate-700 transition">Exit</button>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto px-4 py-12">
        <div class="mb-12">
            <div class="flex justify-between items-center mb-6">
                <div class="flex flex-col">
                    <h1 class="text-2xl font-bold dark:text-white">Course Creation</h1>
                    <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Step 2 of 4: Curriculum</p>
                </div>
                <div class="w-48 bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                    <div class="bg-primary h-full w-2/4 transition-all duration-500"></div>
                </div>
            </div>
            <div class="grid grid-cols-4 gap-4">
                <div class="flex flex-col items-center gap-2">
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-primary flex items-center justify-center">
                        <span class="material-symbols-outlined text-xl">check_circle</span>
                    </div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Basic Info</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div
                        class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center ring-4 ring-blue-50 dark:ring-blue-900/30">
                        <span class="material-symbols-outlined text-xl">menu_book</span>
                    </div>
                    <span class="text-[10px] font-bold text-primary uppercase tracking-widest">Curriculum</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div
                        class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-400 flex items-center justify-center">
                        <span class="material-symbols-outlined text-xl">payments</span>
                    </div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pricing</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div
                        class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-400 flex items-center justify-center">
                        <span class="material-symbols-outlined text-xl">publish</span>
                    </div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Publish</span>
                </div>
            </div>
        </div>
        <div class="space-y-6">

            <button
                class="w-full py-6 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl flex items-center justify-center gap-3 text-slate-500 hover:text-primary hover:border-primary/50 hover:bg-white transition bg-slate-100/50">
                <span class="material-symbols-outlined text-2xl">library_add</span>
                <span class="font-bold text-lg">Add New Section</span>
            </button>
            <div class="flex justify-between items-center py-8">
                <button
                    class="flex items-center gap-2 px-6 py-3 text-slate-600 dark:text-slate-400 font-bold hover:bg-slate-200 dark:hover:bg-slate-800 rounded-xl transition">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Previous
                </button>
                <button
                    class="bg-accent hover:bg-purple-700 text-white flex items-center gap-2 px-10 py-3 rounded-xl font-bold transition transform active:scale-95 shadow-lg shadow-purple-500/20">
                    Save &amp; Next
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </div>
        </div>
    </main>
    <footer class="mt-12 py-8 border-t border-slate-200 dark:border-slate-800 text-center">
        <p class="text-slate-500 dark:text-slate-600 text-xs">
            © 2024 Tacliimi Learn - Multi-Institutional E-Learning Platform.
            <span class="mx-2">|</span>
            Need help? <a class="underline hover:text-primary" href="#">Contact Instructor Support</a>
        </p>
    </footer>

</body>

</html>
