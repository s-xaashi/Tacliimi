<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Instructor Dashboard | Tacliimi Learn</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4F46E5",
                        "background-light": "#F9FAFB",
                        "background-dark": "#111827",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                    },
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        /* Hide content until router loads it */
        #instructor-content-area {
            opacity: 1;
            transition: opacity 0.2s ease-in-out;
        }
        #instructor-content-area.loading {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <aside
        class="fixed left-0 top-0 h-full w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 hidden lg:flex flex-col z-20">
        <div class="p-6 border-b border-slate-100 dark:border-slate-800">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/index.html'">
                <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
                    <span class="material-symbols-outlined text-white text-lg">school</span>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Tacliimi</span>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-1" id="instructor-sidebar-nav">
            <a class="nav-link flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg transition-colors"
                href="/instructor-dashboard/">
                <span class="material-symbols-outlined">dashboard</span>
                Dashboard
            </a>
            <a class="nav-link flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg transition-colors"
                href="/instructor-courses/">
                <span class="material-symbols-outlined">auto_stories</span>
                My Courses
            </a>
            <a class="nav-link flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg transition-colors"
                href="/instructor-mentorship/">
                <span class="material-symbols-outlined">groups</span>
                Mentorship
            </a>
            <a class="nav-link flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg transition-colors"
                href="/instructor-analytics/">
                <span class="material-symbols-outlined">analytics</span>
                Analytics
            </a>
            <a class="nav-link flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg transition-colors"
                href="/instructor-earnings/">
                <span class="material-symbols-outlined">payments</span>
                Earnings
            </a>
            <a class="nav-link flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg transition-colors"
                href="/instructor-communications/">
                <span class="material-symbols-outlined">message</span>
                Communications
            </a>
        </nav>
    </aside>

    <div class="lg:ml-64 min-h-screen flex flex-col">
        <header
            class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-8 sticky top-0 z-10 shrink-0">
            <h1 class="text-lg font-semibold dark:text-white" id="header-page-title">Dashboard</h1>
            <div class="flex items-center gap-4">
                <button class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 relative">
                    <span class="material-symbols-outlined">notifications</span>
                    <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <button class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                    onclick="document.documentElement.classList.toggle('dark')">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
                <div class="flex items-center gap-3 pl-4 border-l border-slate-200 dark:border-slate-800 cursor-pointer hover:opacity-80 transition-opacity"
                    onclick="window.location.href='/instructor-profile/index.html'">
                    <div class="text-right hidden sm:block">
                        <p class="text-sm font-medium dark:text-white">Instructor account</p>
                        <p class="text-xs text-slate-500">ID: 32342</p>
                    </div>
                    <div
                        class="flex h-10 w-10 items-center justify-center overflow-hidden rounded-full bg-slate-100 text-slate-400 dark:bg-slate-800 border-2 border-primary/20 hover:border-primary transition-colors">
                        <span class="material-symbols-outlined text-2xl">account_circle</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- DYNAMIC CONTENT AREA -->
        <main id="instructor-content-area" class="flex-1 bg-background-light dark:bg-background-dark pb-20">
            <!-- Content injected here via SPA router -->
        </main>
    </div>

    <!-- Router Logic -->
    <script src="/js/instructor-app.js"></script>
</body>

</html>
